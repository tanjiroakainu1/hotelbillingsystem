<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Billing &amp; Discounts</title>
  <script>
    const destination = new URL('billing.html', window.location.href);
    new URLSearchParams(window.location.search).forEach((value, key) => destination.searchParams.set(key, value));
    destination.searchParams.set('tab', 'discounts');
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body><p>Discount management is now part of Billing &amp; Discounts. <a href="billing.html?tab=discounts">Continue to Discounts</a>.</p></body>
</html>
