<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing &amp; Discounts · Aurora Grand Hotel</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=61" />
</head>
<body data-role="admin" data-page="billing">
  <div id="app"></div>

  <template id="page-billing">
    <div id="flash"></div>
    <ol class="flow-steps" id="billing-flow">
      <li data-step="checkin"><span>1</span><div><strong>Guest Account</strong><small>Select the guest and stay</small></div></li>
      <li data-step="charges"><span>2</span><div><strong>Add Charges</strong><small>Food, laundry and hotel items</small></div></li>
      <li data-step="account"><span>3</span><div><strong>Account</strong><small>Review charges and payment</small></div></li>
    </ol>
    <div id="billing-panel" class="split">
      <section class="panel">
        <h2>Guest Accounts</h2>
        <p class="muted">Select a guest account to start or continue a stay bill.</p>
        <div class="table-wrap">
          <table class="billing-history-table">
            <thead><tr><th>Guest</th><th>Rooms</th><th>Stay dates</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead>
            <tbody id="open-bills-tbody"><tr><td colspan="8" class="empty">Loading accounts...</td></tr></tbody>
          </table>
        </div>
        <h2 style="margin-top:16px;">Open Guest Account</h2>
        <p class="muted">Choose a guest card to immediately display their active rooms. Select a room card to open its account.</p>
        <div id="bill-guest-cards" class="billing-account-grid"></div>
        <section id="bill-room-selection" class="billing-account-rooms hidden">
          <h3>Active rooms for <span id="bill-selected-guest-name"></span></h3>
          <div id="bill-account-rooms" class="appointment-room-cards"></div>
          <p class="muted" id="bill-account-room-empty"></p>
          <div class="actions"><button type="button" class="btn btn-secondary" id="bill-manual-account">Open account without a stay</button></div>
        </section>
        <label class="billing-due-date">Account due date<input type="date" id="bill-due-date"></label>
      </section>
      <section class="panel" id="bill-workspace">
        <div class="row-between"><div><h2 id="bill-title">Select a guest account</h2><small class="muted" id="bill-created-at"></small></div><a class="btn btn-secondary btn-sm hidden" id="bill-back-to-accounts" href="billing.html">All guest accounts</a></div>
        <p class="empty" id="bill-empty">Choose an existing account or open one for a guest.</p>
        <div class="stay-card hidden" id="bill-stay"></div>
        <ul class="kpi-list hidden" id="bill-kpi"></ul>
        <div class="table-wrap hidden" id="bill-items-wrap">
          <table><thead><tr><th>Type</th><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th><th></th></tr></thead><tbody id="bill-items-tbody"></tbody></table>
        </div>
        <div class="hidden" id="bill-charge-forms">
          <section class="panel billing-room-panel">
            <h3>Guest rooms &amp; room accounts</h3>
            <p class="muted" id="bill-delivery-empty">All active rooms are shown. Charges are added only to the selected checked-in room account.</p>
            <div id="bill-delivery-rooms" class="appointment-room-cards billing-room-chooser"></div>
          </section>
          <div class="billing-catalog-toolbar">
            <div><strong>Available charges</strong><small class="muted" id="bill-charge-target-label">Choose a category to browse charges.</small></div>
            <input id="bill-catalog-search" type="search" placeholder="Search food, laundry, or items" aria-label="Search charges">
            <div class="billing-catalog-filters" role="group" aria-label="Filter charges">
              <button type="button" class="btn btn-secondary btn-sm is-active" data-bill-filter="all">All</button>
              <button type="button" class="btn btn-secondary btn-sm" data-bill-filter="food">Food</button>
              <button type="button" class="btn btn-secondary btn-sm" data-bill-filter="laundry">Laundry</button>
              <button type="button" class="btn btn-secondary btn-sm" data-bill-filter="items">Hotel items</button>
              <button type="button" class="btn btn-secondary btn-sm" data-bill-filter="discounts">Discounts</button>
            </div>
          </div>
          <section class="panel billing-catalog-section" id="bill-services-panel"><h3>Food &amp; Laundry</h3><div id="bill-service-cards" class="billing-catalog-grid"></div></section>
          <section class="panel billing-catalog-section" id="bill-items-panel"><h3>Hotel Items</h3><div id="bill-item-cards" class="billing-catalog-grid"></div></section>
          <section class="charge-card billing-catalog-section" id="bill-discounts-panel">
            <h3>Authorized Discount</h3><p class="muted">Applied to the guest account total.</p>
            <div id="bill-discount-cards" class="billing-discount-grid"></div>
          </section>
        </div>
        <p class="notice-panel hidden" id="bill-locked"></p>
        <div class="actions hidden" id="bill-actions" style="margin-top:12px;">
          <a class="btn btn-primary" id="bill-pay-link" href="payments.html">Take Payment</a>
          <a class="btn btn-secondary" id="bill-invoice-link" href="invoices.html">Invoice</a>
        </div>
      </section>
    </div>
  </template>

  <template id="page-discounts">
    <div id="flash"></div>
    <div class="grid grid-2">
      <section class="panel">
        <h2>Senior Citizen</h2>
        <p class="muted">Government-mandated system discount (edit only).</p>
        <form id="form-senior" class="form-stack">
          <div><label for="sen-name">Name</label><input id="sen-name" name="name" value="Senior Citizen Discount" required></div>
          <div><label for="sen-value">Percent</label><input id="sen-value" type="number" step="0.01" min="0.01" max="100" name="value" value="10" required></div>
          <div><label for="sen-desc">Description</label><input id="sen-desc" name="description" value="" placeholder="Describe eligibility and required proof"></div>
          <button class="btn btn-primary" type="submit">Save Senior</button>
        </form>
      </section>
      <section class="panel">
        <h2>PWD</h2>
        <p class="muted">Government-mandated system discount (edit only).</p>
        <form id="form-pwd" class="form-stack">
          <div><label for="pwd-name">Name</label><input id="pwd-name" name="name" value="PWD Discount" required></div>
          <div><label for="pwd-value">Percent</label><input id="pwd-value" type="number" step="0.01" min="0.01" max="100" name="value" value="10" required></div>
          <div><label for="pwd-desc">Description</label><input id="pwd-desc" name="description" value="" placeholder="Describe eligibility and required proof"></div>
          <button class="btn btn-primary" type="submit">Save PWD</button>
        </form>
      </section>
      <section class="panel">
        <h2>Employee</h2>
        <p class="muted">System discount for hotel employees (edit only).</p>
        <form id="form-employee" class="form-stack">
          <div><label for="emp-name">Name</label><input id="emp-name" name="name" value="Employee Discount" required></div>
          <div><label for="emp-value">Percent</label><input id="emp-value" type="number" step="0.01" min="0.01" max="100" name="value" value="10" required></div>
          <div><label for="emp-desc">Description</label><input id="emp-desc" name="description" value="" placeholder="Describe eligibility and required proof"></div>
          <button class="btn btn-primary" type="submit">Save Employee</button>
        </form>
      </section>
    </div>
    <section class="panel" style="margin-top:16px;">
      <h2>Additional Discounts</h2>
      <p class="muted">Custom discounts are available for authorized use on guest bills. Review the description, discount type, value and status here. System discounts above cannot be deleted.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Description</th><th>Type / Value</th><th>Status</th><th>Edit / Delete</th></tr></thead>
          <tbody id="disc-tbody"><tr><td colspan="5" class="empty">Loading discounts…</td></tr></tbody>
        </table>
      </div>
    </section>
    <section class="panel" style="margin-top:16px;">
      <h2>Add Discount</h2>
      <form id="disc-create" class="form-grid">
        <div><label for="disc-name">Name</label><input id="disc-name" name="name" required></div>
        <div><label for="disc-type">Discount type</label><select id="disc-type" name="discount_type" required><option value="percent">Percent</option><option value="fixed">Fixed amount</option></select></div>
        <div><label for="disc-value">Value</label><input id="disc-value" type="number" min="0.01" max="100" step="0.01" name="value" required></div>
        <div><label for="disc-description">Details / eligibility</label><textarea id="disc-description" name="description" rows="2" placeholder="Explain who qualifies and any conditions"></textarea></div>
        <div class="actions"><button class="btn btn-primary" type="submit">Add Discount</button></div>
      </form>
    </section>
  </template>

  <script src="../assets/js/script.js?v=130"></script>
</body>
</html>
