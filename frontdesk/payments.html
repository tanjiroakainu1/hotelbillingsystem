<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments &amp; Invoices · Aurora Grand Hotel</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=61" />
</head>
<body data-role="frontdesk" data-page="payments">
  <div id="app"></div>

  <!-- Page markup (cloned into #main-div by script.js) -->
  <template id="page-payments">
    <div id="flash"></div>
      <section class="panel">
        <div class="row-between">
          <h2>Record Payment</h2>
          <a class="btn btn-secondary btn-sm" href="billing.html">Back to Billing</a>
        </div>
        <p class="muted">Choose a guest account to review every room and billed item. Any payment is automatically allocated across that account’s outstanding room balances. Cash receipts are generated automatically; GCash and bank transfers require their transaction reference.</p>
        <form id="payment-form" class="form-grid" style="grid-template-columns:1fr;">
          <div>
            <label for="payment-account-select">Guest account</label>
            <select id="payment-account-select" required>
              <option value="">Select guest account…</option>
            </select>
            <p class="muted" id="payment-account-summary">Choose a guest account to list all billed items and balances.</p>
          </div>
          <div id="bill-breakdown" class="bill-breakdown" hidden></div>
          <div><label for="payment-amount">Amount to apply across this account</label><input id="payment-amount" type="number" step="0.01" min="0.01" name="amount" required></div>
          <div>
            <label>Payment Method</label>
            <div class="pay-methods" role="radiogroup" aria-label="Payment method">
              <label class="pay-method">
                <input type="radio" name="method" value="cash" checked>
                <span class="pay-method-icon pay-cash">₱</span>
                <span><strong>Cash (counter)</strong><small>Paid at the front desk counter</small></span>
              </label>
              <label class="pay-method">
                <input type="radio" name="method" value="gcash">
                <span class="pay-method-icon pay-gcash">G</span>
                <span><strong>GCash</strong><small>Scan / send to hotel GCash</small></span>
              </label>
              <label class="pay-method">
                <input type="radio" name="method" value="bank_transfer">
                <span class="pay-method-icon pay-bank">B</span>
                <span><strong>Bank Transfer</strong><small>Deposit to the hotel bank account</small></span>
              </label>
            </div>
          </div>
          <div id="payment-destination" class="gcash-info hidden"></div>
          <div id="payment-ref-wrap" hidden>
            <label id="payment-ref-label" for="payment-ref">GCash reference number (required)</label>
            <input id="payment-ref" name="reference_no" placeholder="Enter the transfer reference" autocomplete="off">
          </div>
          <div><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
          <button class="btn btn-secondary" type="button" id="pay-all">Pay full balance (everything availed)</button>
          <button class="btn btn-primary" type="submit">Record Payment</button>
        </form>
      </section>
    <section class="panel" style="margin-top:16px;">
        <h2>Payment History</h2>
        <p class="muted">Export PDF copies of recorded payment receipts directly to your Downloads folder.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>When</th>
                <th>Invoice</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Receipt</th>
              </tr>
            </thead>
            <tbody id="payments-tbody">
              <tr><td colspan="5" class="empty">Loading payment history...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
  </template>

  <template id="page-invoices">
    <div id="flash"></div>
    <div class="split">
      <section class="panel">
        <h2>Billing History</h2>
        <p class="muted">Guest accounts for checked-in and checked-out stays. Open an account to export its invoice and payment receipts as PDFs.</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Guest account</th><th>Rooms / Stay</th><th>Total charges</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead>
            <tbody id="invoices-list"><tr><td colspan="7" class="empty">Loading billing history...</td></tr></tbody>
          </table>
        </div>
      </section>
      <section class="panel" id="invoice-detail">
        <p class="empty">Select an invoice.</p>
      </section>
    </div>
  </template>

  <script src="../assets/js/script.js?v=130"></script>
</body>
</html>
