<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Rooms &amp; Hotel Services</title>
  <script>
    const destination = new URL('rooms.html', window.location.href);
    new URLSearchParams(window.location.search).forEach((value, key) => destination.searchParams.set(key, value));
    destination.searchParams.set('tab', 'services');
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body><p>Hotel Services are now part of Rooms &amp; Hotel Services. <a href="rooms.html?tab=services">Continue to Hotel Services</a>.</p></body>
</html>
