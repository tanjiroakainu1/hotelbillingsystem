<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Guest Management</title>
  <script>
    const destination = new URL('guests.html', window.location.href);
    new URLSearchParams(window.location.search).forEach((value, key) => destination.searchParams.set(key, value));
    destination.searchParams.set('tab', 'register');
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body><p>Guest registration is now part of Guest Management. <a href="guests.html?tab=register">Continue to Register Guest</a>.</p></body>
</html>
