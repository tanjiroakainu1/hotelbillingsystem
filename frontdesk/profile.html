<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile · Aurora Grand Hotel</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=61" />
</head>
<body data-role="frontdesk" data-page="profile">
  <div id="app"></div>

  <!-- Page markup (cloned into #main-div by script.js) -->
  <template id="page-profile">
    <div id="flash"></div>
    <div class="grid grid-2">
      <section class="panel">
        <h2>Update Profile</h2>
        <form id="prof-form" class="form-grid" style="grid-template-columns:1fr;">
          <div><label>Full Name</label><input name="full_name" required autocomplete="name"></div>
          <div><label>Email</label><input name="email" type="email" required autocomplete="email"></div>
          <div><label>Phone</label><input name="phone" autocomplete="tel"></div>
          <div id="prof-gender-wrap" hidden>
            <label>Gender</label>
            <select name="gender">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Save Profile</button>
        </form>
      </section>
      <section class="panel">
        <h2>Change Password</h2>
        <form id="pw-form" class="form-grid" style="grid-template-columns:1fr;">
          <div><label>Current Password</label><input type="password" name="current_password" required autocomplete="current-password"></div>
          <div><label>New Password</label><input type="password" name="new_password" required minlength="6" autocomplete="new-password"></div>
          <div><label>Confirm</label><input type="password" name="confirm_password" required autocomplete="new-password"></div>
          <button class="btn btn-secondary" type="submit">Change Password</button>
        </form>
      </section>
    </div>
  </template>

  <script src="../assets/js/script.js?v=130"></script>
</body>
</html>
