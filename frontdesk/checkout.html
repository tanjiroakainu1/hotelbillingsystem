<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Check-In / Check-Out</title>
  <script>
    const destination = new URL('checkin.html', window.location.href);
    new URLSearchParams(window.location.search).forEach((value, key) => destination.searchParams.set(key, value));
    destination.searchParams.set('tab', 'checkout');
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <p>Check-Out is now part of the combined stay page. <a href="checkin.html?tab=checkout">Continue to Check-Out</a>.</p>
</body>
</html>
