<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Room Management</title>
  <script>
    const destination = new URL('room-management.html', window.location.href);
    new URLSearchParams(window.location.search).forEach((value, key) => destination.searchParams.set(key, value));
    destination.searchParams.set('tab', 'extend-stay');
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <p>Stay extensions are now part of Room Management. <a href="room-management.html?tab=extend-stay">Continue to Extend Stay</a>.</p>
</body>
</html>
